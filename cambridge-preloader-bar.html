<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambridge Marketing</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1A1A;
    --orange:#FF5A00;
    --font:'Instrument Serif', serif;
  }

  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    font-family:'Inter',system-ui,sans-serif;
    overflow:hidden;
  }
  /* Scroll only comes back once the zoom has fully settled — see finish().
     Until then the scaled hero spills past the viewport and summons a
     scrollbar mid-transition. */
  body.scrollable{overflow:auto}

  /* `clip` contains transform overflow without becoming a scroll
     container the way `hidden` would. Belt and braces. */
  #page{overflow:clip}

  #loader{
    position:fixed;inset:0;z-index:50;
    background:var(--bg);
    display:grid;place-content:center;
    transition:opacity 1s ease;
  }
  #loader.out{opacity:0;pointer-events:none}

  /* ambient bloom, brightens as the bar fills */
  #loader::before{
    content:"";position:absolute;
    left:50%;top:50%;translate:-50% -50%;
    width:120vmin;aspect-ratio:1;
    background:radial-gradient(circle,rgba(255,90,0,.16),transparent 60%);
    opacity:var(--p,0);
    pointer-events:none;
  }

  .stage{
    width:min(380px,72vw);
    position:relative;
    transform-origin:50% 50%;
    transition:transform 1.15s cubic-bezier(.66,0,.24,1),
               filter    1.15s cubic-bezier(.66,0,.24,1),
               opacity    .85s ease .12s;
  }
  #loader.out .stage{
    transform:scale(1.45);
    filter:blur(16px);
    opacity:0;
  }

  .meta{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:12px;font-weight:500;
    letter-spacing:.18em;text-transform:uppercase;
    color:#5A5A5A;
  }
  .meta b{
    font-weight:700;color:var(--orange);
    font-variant-numeric:tabular-nums;
  }

  .rule{
    margin-top:14px;height:1px;
    background:rgba(255,255,255,.08);
    position:relative;
  }
  .rule::after{
    content:"";position:absolute;inset:0;
    background:var(--orange);
    transform:scaleX(var(--p,0));
    transform-origin:left;
  }

  /* page beneath */
  main{
    min-height:100vh;
    display:grid;place-content:center;
    padding:6vw;text-align:center;
    transform:scale(1.06);opacity:0;
    transition:transform 1.3s cubic-bezier(.22,1,.36,1),opacity 1s ease;
  }
  body.done main{transform:scale(1);opacity:1}
  main h1{
    font-family:var(--font);
    font-size:clamp(32px,6vw,76px);
    line-height:1.03;color:#EDEDED;
  }
  main em{font-style:italic;color:var(--orange)}

  .replay{
    position:fixed;right:18px;bottom:18px;z-index:60;
    background:none;border:1px solid #333;color:#666;
    font:inherit;font-size:11px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;
    padding:10px 18px;border-radius:99px;cursor:pointer;
  }
  .replay:hover{color:var(--orange);border-color:var(--orange)}
  .replay:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
</style>
</head>
<body>

<div id="loader" role="status" aria-live="polite">
  <div class="stage">
    <div class="meta">
      <span>Loading</span>
      <b><span id="pct">0</span>%</b>
    </div>
    <div class="rule"></div>
  </div>
</div>

<div id="page">
  <main>
    <h1>Next-gen marketing.<br><em>Real growth.</em></h1>
  </main>
</div>

<button class="replay" id="replay">Replay</button>

<script>
const DURATION = 6500;

const $ = id => document.getElementById(id);
const root = document.documentElement;
const loader = $('loader'), pctEl = $('pct');

let start = null, level = 0, filled = false, raf;

function frame(now){
  if (start === null) start = now;

  // eased rise: lerp toward the linear target so it starts soft and settles
  const target = Math.min((now - start) / DURATION, 1);
  level += (target - level) * 0.05;
  if (target === 1 && 1 - level < .0015) level = 1;

  root.style.setProperty('--p', level.toFixed(4));  // drives bar + bloom
  pctEl.textContent = Math.round(level * 100);

  if (level === 1 && !filled){ filled = true; setTimeout(finish, 700); }
  if (!filled) raf = requestAnimationFrame(frame);
}

function finish(){
  loader.classList.add('out');
  document.body.classList.add('done');

  // Wait for the zoom to land before handing scroll back. Enabling it
  // any earlier is what makes the scrollbar flash.
  loader.addEventListener('transitionend', () => {
    loader.style.display = 'none';
    document.body.classList.add('scrollable');
  }, { once:true });
}

function play(){
  cancelAnimationFrame(raf);
  start = null; level = 0; filled = false;
  loader.style.display = '';
  loader.classList.remove('out');
  document.body.classList.remove('done','scrollable');
  raf = requestAnimationFrame(frame);
}

$('replay').onclick = play;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
</script>
</body>
</html>
