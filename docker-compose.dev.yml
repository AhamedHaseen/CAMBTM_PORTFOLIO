services:
  # Development Service with Live Hot-Reloading
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cambm-app-dev
    restart: "no"
    ports:
      - "5173:5173" # Vite Dev Server
      - "5000:5000" # Express Backend API
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=development
      - PORT=5000
    volumes:
      - .:/app
      - /app/node_modules
      - ./data:/app/data
      - ./uploads:/app/uploads
